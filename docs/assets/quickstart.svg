<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" xml:space="preserve" font-family="ui-monospace, &#39;SF Mono&#39;, &#39;JetBrains Mono&#39;, Menlo, Consolas, &#39;DejaVu Sans Mono&#39;, monospace" role="img" aria-label="Quickstart terminal. pipx install frontier-scout. frontier-scout packs candidates --repo . --client claude-code, which lists six repo-ranked servers with static safety and no server executed. frontier-scout packs sanction a server (high-risk needs --acknowledge-risk). frontier-scout packs export --client claude-code --target ./out, which writes a managed allow/deny fragment for admin review as a static export.">
  <rect width="1280" height="300" fill="#05080b"></rect>

  <rect x="120" y="28" width="1040" height="244" rx="14" fill="#0b1117" stroke="#1a2c41"></rect>
  <rect x="120" y="28" width="1040" height="36" rx="14" fill="#0e1620"></rect>
  <rect x="120" y="50" width="1040" height="14" fill="#0e1620"></rect>
  <circle cx="152" cy="46" r="5" fill="#ff6b6b" fill-opacity="0.75"></circle>
  <circle cx="170" cy="46" r="5" fill="#e3c26f" fill-opacity="0.75"></circle>
  <circle cx="188" cy="46" r="5" fill="#24d6a8" fill-opacity="0.75"></circle>
  <text x="640" y="51" fill="#46596b" font-size="12.5" letter-spacing="1" text-anchor="middle">frontier-scout · sanctioned packs</text>

  <text x="160" y="104" font-size="16"><tspan fill="#24d6a8">$ </tspan><tspan fill="#d9f7ff">pipx install frontier-scout</tspan></text>
  <text x="160" y="138" font-size="16"><tspan fill="#24d6a8">$ </tspan><tspan fill="#d9f7ff">frontier-scout packs candidates --repo . --client claude-code</tspan></text>
  <text x="186" y="162" fill="#5d7184" font-size="14.5">6 repo-ranked servers · static safety · no server executed</text>
  <text x="160" y="196" font-size="16"><tspan fill="#24d6a8">$ </tspan><tspan fill="#d9f7ff">frontier-scout packs sanction &lt;server&gt;</tspan><tspan fill="#46596b">   # high-risk: --acknowledge-risk</tspan></text>
  <text x="160" y="230" font-size="16"><tspan fill="#24d6a8">$ </tspan><tspan fill="#d9f7ff">frontier-scout packs export --client claude-code --target ./out</tspan></text>
  <text x="186" y="254" fill="#5d7184" font-size="14.5">managed allow/deny fragment for admin review · static export</text>
</svg>
