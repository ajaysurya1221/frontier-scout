<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" fill="none" role="img" aria-label="The pipeline: 01 WATCH — scout the whole web across GitHub, MCP registry, Hugging Face, HN, RSS and arXiv. 02 MATCH — a local tree-sitter pass maps releases to your repo&#39;s real stack, never reading your source. 03 DECIDE — a source-backed ADOPT, TRIAL, ASSESS or HOLD verdict plus the smallest safe trial to run next.">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1623"></stop><stop offset="1" stop-color="#0a0f1a"></stop></linearGradient>
    
  </defs>
  <rect x="1" y="1" width="998" height="298" rx="16" fill="url(#p-bg)" stroke="#ffffff" stroke-opacity=".08"></rect>

  
  <line class="wire" x1="318" y1="150" x2="352" y2="150" stroke="#4d82ff" stroke-opacity=".7" stroke-width="2"></line>
  <line class="wire" x1="648" y1="150" x2="682" y2="150" stroke="#1fcf9f" stroke-opacity=".7" stroke-width="2"></line>
  <path d="M340 150 l-10 -5 v10 z" fill="#4d82ff"></path>
  <path d="M670 150 l-10 -5 v10 z" fill="#1fcf9f"></path>

  
  <g transform="translate(36,40)">
    <rect x="0" y="0" width="282" height="220" rx="13" fill="#ffffff" fill-opacity=".02" stroke="#ffffff" stroke-opacity=".08"></rect>
    <rect x="0" y="0" width="4" height="220" rx="2" fill="#2a5fe0"></rect>
    <text x="24" y="36" class="m" font-size="12" letter-spacing="2.5" fill="#647a93" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">01 · WATCH</text>
    <text x="24" y="66" class="d" font-size="20" fill="#eaf1fb" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">Scout the web</text>
    
    <g transform="translate(24,90)" class="m" font-size="11.5" fill="#9fb2c9">
      <g><rect x="0" y="0" width="110" height="26" rx="6" fill="#4d82ff" fill-opacity=".1" stroke="#4d82ff" stroke-opacity=".25"></rect><text x="14" y="17" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">GitHub</text></g>
      <g transform="translate(120,0)"><rect x="0" y="0" width="114" height="26" rx="6" fill="#4d82ff" fill-opacity=".1" stroke="#4d82ff" stroke-opacity=".25"></rect><text x="14" y="17" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">MCP registry</text></g>
      <g transform="translate(0,34)"><rect x="0" y="0" width="124" height="26" rx="6" fill="#4d82ff" fill-opacity=".1" stroke="#4d82ff" stroke-opacity=".25"></rect><text x="14" y="17" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">Hugging Face</text></g>
      <g transform="translate(134,34)"><rect x="0" y="0" width="100" height="26" rx="6" fill="#4d82ff" fill-opacity=".1" stroke="#4d82ff" stroke-opacity=".25"></rect><text x="14" y="17" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">PyPI · npm</text></g>
    </g>
    <text x="24" y="196" class="m" font-size="11" fill="#647a93" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">candidate → watched → core</text>
  </g>

  
  <g transform="translate(366,40)">
    <rect x="0" y="0" width="282" height="220" rx="13" fill="#ffffff" fill-opacity=".02" stroke="#ffffff" stroke-opacity=".08"></rect>
    <rect x="0" y="0" width="4" height="220" rx="2" fill="#12a06f"></rect>
    <text x="24" y="36" class="m" font-size="12" letter-spacing="2.5" fill="#647a93" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">02 · MATCH</text>
    <text x="24" y="66" class="d" font-size="20" fill="#eaf1fb" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">Map to your repo</text>
    <text x="24" y="92" class="s" font-size="12.5" fill="#9fb2c9" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">Local tree-sitter AST pass —</text>
    <text x="24" y="110" class="s" font-size="12.5" fill="#9fb2c9" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">imports only, <tspan class="d" fill="#cdd9e6">never your source.</tspan></text>
    
    <g transform="translate(24,128)" class="m" font-size="10.5" fill="#7d8ea3">
      <text x="0" y="9" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">fit</text><rect x="42" y="2" width="192" height="6" rx="3" fill="#ffffff" fill-opacity=".06"></rect><rect x="42" y="2" width="160" height="6" rx="3" fill="#1fcf9f"></rect>
      <text x="0" y="29" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">risk</text><rect x="42" y="22" width="192" height="6" rx="3" fill="#ffffff" fill-opacity=".06"></rect><rect x="42" y="22" width="80" height="6" rx="3" fill="#f0c66a"></rect>
      <text x="0" y="49" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">ready</text><rect x="42" y="42" width="192" height="6" rx="3" fill="#ffffff" fill-opacity=".06"></rect><rect x="42" y="42" width="120" height="6" rx="3" fill="#4d82ff"></rect>
    </g>
    <text x="24" y="196" class="m" font-size="11" fill="#647a93" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">langchain-core · docker · py3.12</text>
  </g>

  
  <g transform="translate(696,40)">
    <rect x="0" y="0" width="282" height="220" rx="13" fill="#ffffff" fill-opacity=".02" stroke="#ffffff" stroke-opacity=".08"></rect>
    <rect x="0" y="0" width="4" height="220" rx="2" fill="#c08a12"></rect>
    <text x="24" y="36" class="m" font-size="12" letter-spacing="2.5" fill="#647a93" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">03 · DECIDE</text>
    <text x="24" y="66" class="d" font-size="20" fill="#eaf1fb" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">Verdict + receipt</text>
    
    <g transform="translate(24,86)" class="m" font-size="11">
      <g><rect x="0" y="0" width="74" height="24" rx="12" fill="#12a06f" fill-opacity=".14" stroke="#12a06f" stroke-opacity=".4"></rect><text x="37" y="16" text-anchor="middle" fill="#1fcf9f" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">ADOPT</text></g>
      <g transform="translate(84,0)"><rect x="0" y="0" width="70" height="24" rx="12" fill="#f0c66a" fill-opacity=".14" stroke="#f0c66a" stroke-opacity=".4"></rect><text x="35" y="16" text-anchor="middle" fill="#f0c66a" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">TRIAL</text></g>
      <g transform="translate(0,32)"><rect x="0" y="0" width="84" height="24" rx="12" fill="#4d82ff" fill-opacity=".14" stroke="#4d82ff" stroke-opacity=".4"></rect><text x="42" y="16" text-anchor="middle" fill="#5b8cff" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">ASSESS</text></g>
      <g transform="translate(94,32)"><rect x="0" y="0" width="66" height="24" rx="12" fill="#d2453d" fill-opacity=".14" stroke="#d2453d" stroke-opacity=".45"></rect><text x="33" y="16" text-anchor="middle" fill="#e8766e" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">HOLD</text></g>
    </g>
    <text x="24" y="172" class="s" font-size="12" fill="#9fb2c9" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">+ permission map · concerns</text>
    <text x="24" y="196" class="m" font-size="11" fill="#647a93" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">smallest safe trial to run next</text>
  </g>
</svg>