    <text x="430" y="0" text-anchor="end" class="sb" font-size="13" fill="#1fcf9f" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">high · 0.86</text>
    <rect x="0" y="10" width="430" height="7" rx="3.5" fill="#ffffff" fill-opacity=".07"></rect>
    <rect x="0" y="10" width="370" height="7" rx="3.5" fill="url(#m-fit)"></rect>

    
    <text x="0" y="46" fill="#7d8ea3" letter-spacing="1.5" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">RISK LEVEL</text>
