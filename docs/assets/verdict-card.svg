    <text x="60" y="27" text-anchor="middle" class="d" font-size="21" letter-spacing="1" fill="#1a1205" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">TRIAL</text>
    <text x="138" y="18" class="m" font-size="12.5" letter-spacing="2" fill="#f0c66a" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">SAFE TO TEST · NOT TO SHIP</text>
    <text x="138" y="38" class="sb" font-size="17" fill="#eaf1fb" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">modelcontextprotocol/servers</text>
    
    <g transform="translate(720,4)">
      <rect x="0" y="0" width="200" height="34" rx="8" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"></rect>
      <text x="16" y="22" class="m" font-size="12" fill="#9fb2c9" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">type</text>
      <text x="184" y="22" text-anchor="end" class="sb" font-size="13" fill="#eaf1fb" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">MCP server</text>
