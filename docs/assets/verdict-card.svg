      <g transform="translate(268,0)"><rect x="0" y="0" width="122" height="30" rx="7" fill="#f0c66a" fill-opacity=".12" stroke="#f0c66a" stroke-opacity=".4"></rect><circle cx="16" cy="15" r="4" fill="#f0c66a"></circle><text x="30" y="19" fill="#cdd9e6" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">net</text><text x="108" y="19" text-anchor="end" fill="#a98f54" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">watch</text></g>
    </g>
    
    <g transform="translate(0,56)">
      <g><rect x="0" y="0" width="122" height="30" rx="7" fill="#f0c66a" fill-opacity=".12" stroke="#f0c66a" stroke-opacity=".4"></rect><circle cx="16" cy="15" r="4" fill="#f0c66a"></circle><text x="30" y="19" fill="#cdd9e6" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">write</text><text x="108" y="19" text-anchor="end" fill="#a98f54" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">watch</text></g>
      <g transform="translate(134,0)"><rect x="0" y="0" width="122" height="30" rx="7" fill="#d2453d" fill-opacity=".12" stroke="#d2453d" stroke-opacity=".45"></rect><circle cx="16" cy="15" r="4" fill="#d2453d"></circle><text x="30" y="19" fill="#cdd9e6" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">shell</text><text x="108" y="19" text-anchor="end" fill="#bd6961" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">risky</text></g>
      <g transform="translate(268,0)"><rect x="0" y="0" width="122" height="30" rx="7" fill="#d2453d" fill-opacity=".12" stroke="#d2453d" stroke-opacity=".45"></rect><circle cx="16" cy="15" r="4" fill="#d2453d"></circle><text x="30" y="19" fill="#cdd9e6" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">keys</text><text x="108" y="19" text-anchor="end" fill="#bd6961" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">risky</text></g>
    </g>
  </g>

  
  <line x1="40" y1="296" x2="960" y2="296" stroke="#ffffff" stroke-opacity=".08"></line>
  <g transform="translate(40,318)">
    <path d="M11 2 L20 6 V13 C20 19 16 23 11 25 C6 23 2 19 2 13 V6 Z" fill="#d2453d" fill-opacity=".16" stroke="#d2453d" stroke-opacity=".55"></path>
    <text x="11" y="17" text-anchor="middle" class="sb" font-size="11" fill="#e8766e" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">!</text>
    <text x="36" y="11" class="m" font-size="11.5" letter-spacing="1.5" fill="#7d8ea3" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">GUARD</text>
    <text x="36" y="27" class="sb" font-size="13.5" fill="#eaf1fb" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">Adoption blocked until a sandbox trial receipt exists.</text>
