      <text x="100" y="18" text-anchor="middle" class="m" font-size="11.5" fill="#1fcf9f" letter-spacing="1" font-family="&#34;SFMono-Regular&#34;, Consolas, &#34;Liberation Mono&#34;, Menlo, monospace">▸ NEXT: trial --dry-run</text>
