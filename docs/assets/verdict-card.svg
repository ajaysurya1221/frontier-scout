<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" fill="none" role="img" aria-label="Verdict card: modelcontextprotocol/servers — TRIAL, safe to test not to ship. Fit high 0.86, risk medium 0.42, eval passed. Guard blocks adoption until a trial receipt exists.">
  <defs>
    <linearGradient id="v-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1827"></stop><stop offset="1" stop-color="#0a0f1a"></stop>
    </linearGradient>
    <linearGradient id="v-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c66a" stop-opacity=".16"></stop><stop offset="1" stop-color="#f0c66a" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="m-fit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#12a06f"></stop><stop offset="1" stop-color="#1fcf9f"></stop></linearGradient>
    <linearGradient id="m-risk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c08a12"></stop><stop offset="1" stop-color="#f0c66a"></stop></linearGradient>
    <linearGradient id="m-eval" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a5fe0"></stop><stop offset="1" stop-color="#5b8cff"></stop></linearGradient>
    
  </defs>

  
  <rect x="2" y="2" width="996" height="356" rx="18" fill="url(#v-bg)" stroke="#ffffff" stroke-opacity=".1"></rect>
  
  <path d="M20 2 H980 a18 18 0 0 1 18 18 V96 H2 V20 A18 18 0 0 1 20 2 Z" fill="url(#v-amber)"></path>
  <rect x="2" y="2" width="6" height="356" rx="3" fill="#f0c66a"></rect>

  
  <g transform="translate(40,40)">
