    <text x="430" y="92" text-anchor="end" class="sb" font-size="13" fill="#5b8cff" font-family="Arial, &#34;Helvetica Neue&#34;, Helvetica, &#34;Segoe UI&#34;, system-ui, sans-serif">passed · 1.00 / 1.00</text>
    <rect x="0" y="102" width="430" height="7" rx="3.5" fill="#ffffff" fill-opacity=".07"></rect>
    <rect x="0" y="102" width="430" height="7" rx="3.5" fill="url(#m-eval)"></rect>
  </g>

  
  <line x1="520" y1="138" x2="520" y2="276" stroke="#ffffff" stroke-opacity=".08"></line>

  
