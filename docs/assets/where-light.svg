<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Where frontier-scout sits: the PR diff against the policy on the base branch</title>
<desc id="desc">Between an agent's pull request and the merge decision: every changed path is checked against the scope declared on the base branch. Inputs: the base commit's frontier-scout.policy.json and policy.lock.json, and the candidate PR diff (git diff --name-status -z -M base...HEAD). Local receipts are an unsigned input: reported, never an approval. In CI, agent verify-pr reads the policy and lock from the base commit and checks every changed path against allowed_file_globs and protected_file_globs. Verdicts: FAIL, UNVERIFIED or PASS; anything unproven is never a pass. Outputs: the verdict and an evidence JSON, with PR annotations and a step summary; exit 0 only on PASS when enforcing. Attestation is optional: with attest: "true" the evidence JSON is signed through Sigstore, which names the workflow that produced it, not the approver. A merge gate must run from a workflow the PR cannot edit. This repository's own PRs run the check in frontier-scout-verify.yml in advisory mode: the verdict is reported and the job exits 0.</desc>
