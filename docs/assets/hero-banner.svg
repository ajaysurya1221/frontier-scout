    <rect x="1068" y="186" width="124" height="84" rx="8" fill="#0b1117" stroke="#1a2c41"></rect>
    
    <rect x="800" y="280" width="124" height="84" rx="8" fill="#0b1117" stroke="#1a2c41"></rect>
    <rect x="934" y="280" width="124" height="84" rx="8" fill="#0b1117" stroke="#1a2c41"></rect>
    <rect x="1068" y="280" width="124" height="84" rx="8" fill="#0b1117" stroke="#ff6b6b" stroke-opacity="0.35"></rect>
    <rect x="1068" y="280" width="124" height="84" rx="8" fill="url(#holdHeat)"></rect>
  </g>

  
  <text x="916" y="168" fill="#46596b" font-size="9" letter-spacing="1.5" text-anchor="end">SAFE</text>
  <text x="1184" y="356" fill="#46596b" font-size="9" letter-spacing="1.5" text-anchor="end">HOLD</text>

  
  
  <circle cx="862" cy="134" r="11" fill="#24d6a8" opacity="0.18"></circle>
