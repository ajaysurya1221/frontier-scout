<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="ui-monospace, &#39;SF Mono&#39;, &#39;JetBrains Mono&#39;, Menlo, Consolas, &#39;DejaVu Sans Mono&#39;, monospace" role="img" aria-label="Frontier Scout — sanctioned MCP packs, a research preview. Repo-rank approved MCP servers into a static safety map, then export a Claude Code managed-config fragment. Shown as a left-to-right flow: a repo-ranked candidate list, a static safety check, and a managed config fragment. Claude Code first, static analysis, keyless, research preview, MIT.">
  <defs>
    <radialGradient id="glow" cx="11%" cy="-10%" r="92%">
      <stop offset="0%" stop-color="#24d6a8" stop-opacity="0.13"></stop>
      <stop offset="60%" stop-color="#24d6a8" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="rightGlow" cx="74%" cy="56%" r="48%">
      <stop offset="0%" stop-color="#24d6a8" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#24d6a8" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="checkHeat" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#24d6a8" stop-opacity="0.28"></stop>
      <stop offset="100%" stop-color="#24d6a8" stop-opacity="0"></stop>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="470" rx="0"></rect></clipPath>
  </defs>


  <rect width="1280" height="470" fill="#05080b"></rect>
  <g clip-path="url(#frame)">
    <rect width="1280" height="470" fill="url(#glow)"></rect>
    <rect width="1280" height="470" fill="url(#rightGlow)"></rect>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="469" fill="none" stroke="#1a2c41"></rect>


  <!-- LEFT COLUMN — every element shares a single left edge (x=86) -->
  <text x="48" y="116" fill="#24d6a8" font-size="13.5" letter-spacing="3.4">SANCTIONED MCP PACKS · RESEARCH PREVIEW</text>

  <text x="48" y="212" fill="#d9f7ff" font-size="78" font-weight="700" letter-spacing="1">FRONTIER</text>
  <text x="48" y="296" fill="#24d6a8" font-size="78" font-weight="700" letter-spacing="1">SCOUT</text>

  <text x="48" y="350" fill="#a9bccd" font-size="15">Repo-rank approved MCP servers into a static safety map,</text>
  <text x="48" y="375" fill="#a9bccd" font-size="15">then export a Claude Code managed-config fragment.</text>

  <text x="48" y="418" font-size="11.5" letter-spacing="0.4"><tspan fill="#46596b">Claude Code first</tspan><tspan fill="#1a2c41"> · </tspan><tspan fill="#46596b">static analysis</tspan><tspan fill="#1a2c41"> · </tspan><tspan fill="#46596b">keyless</tspan><tspan fill="#1a2c41"> · </tspan><tspan fill="#46596b">research preview</tspan><tspan fill="#1a2c41"> · </tspan><tspan fill="#46596b">MIT</tspan></text>


  <line x1="600" y1="84" x2="600" y2="438" stroke="#1a2c41"></line>


  <!-- RIGHT DIAGRAM — RANK → CHECK → EXPORT, enlarged and brightened -->
  <text x="737" y="110" fill="#24d6a8" font-size="18" letter-spacing="3.2" text-anchor="middle">RANK</text>
  <text x="958" y="110" fill="#24d6a8" font-size="18" letter-spacing="3.2" text-anchor="middle">CHECK</text>
  <text x="1169" y="110" fill="#24d6a8" font-size="18" letter-spacing="3.2" text-anchor="middle">EXPORT</text>


  <!-- Card 1: repo-ranked candidates -->
  <g>
    <rect x="624" y="138" width="226" height="280" rx="13" fill="#0b1117" stroke="#24d6a8" stroke-opacity="0.55"></rect>
    <text x="644" y="174" fill="#6b8197" font-size="12" letter-spacing="2.2">REPO-RANKED</text>

    <rect x="642" y="188" width="190" height="54" rx="9" fill="#0e1620" stroke="#243a52"></rect>
    <text x="660" y="212" fill="#d9f7ff" font-size="14">filesystem</text>
    <text x="660" y="231" fill="#24d6a8" font-size="11.5">fit high</text>
    <text x="814" y="231" fill="#e3c26f" font-size="11.5" text-anchor="end">risk med</text>

    <rect x="642" y="250" width="190" height="54" rx="9" fill="#0e1620" stroke="#243a52"></rect>
    <text x="660" y="274" fill="#d9f7ff" font-size="14">time</text>
    <text x="660" y="293" fill="#24d6a8" font-size="11.5">fit high</text>
    <text x="814" y="293" fill="#7aa6ff" font-size="11.5" text-anchor="end">risk low</text>

    <rect x="642" y="312" width="190" height="54" rx="9" fill="#0e1620" stroke="#243a52"></rect>
    <text x="660" y="336" fill="#d9f7ff" font-size="14">sentry</text>
    <text x="660" y="355" fill="#24d6a8" font-size="11.5">fit high</text>
    <text x="814" y="355" fill="#e3c26f" font-size="11.5" text-anchor="end">risk med</text>

    <text x="644" y="400" fill="#46596b" font-size="10.5">your repo · tree-sitter</text>
  </g>


  <!-- Arrow 1 -->
  <g stroke="#24d6a8" stroke-opacity="0.6" fill="none">
    <line x1="852" y1="276" x2="876" y2="276" stroke-width="1.5"></line>
  </g>
  <path d="M882 276 l-11 -6 v12 z" fill="#24d6a8" fill-opacity="0.7"></path>


  <!-- Check: static safety -->
  <g>
    <circle cx="958" cy="276" r="78" fill="#0b1117" stroke="#24d6a8" stroke-opacity="0.55"></circle>
    <circle cx="958" cy="276" r="78" fill="url(#checkHeat)"></circle>

    <path d="M926 278 l20 21 l44 -50" fill="none" stroke="#24d6a8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="958" y="190" fill="#6b8197" font-size="12" letter-spacing="2.2" text-anchor="middle">STATIC SAFETY</text>
    <text x="958" y="378" fill="#5d7184" font-size="11.5" text-anchor="middle">no server run</text>
  </g>

  <g>
    <circle cx="908" cy="404" r="4" fill="#ff6b6b"></circle>
    <text x="920" y="408" fill="#5d7184" font-size="10.5">high-risk gated</text>
  </g>


  <!-- Arrow 2 -->
  <g stroke="#24d6a8" stroke-opacity="0.6" fill="none">
    <line x1="1040" y1="276" x2="1064" y2="276" stroke-width="1.5"></line>
  </g>
  <path d="M1070 276 l-11 -6 v12 z" fill="#24d6a8" fill-opacity="0.7"></path>


  <!-- Card 2: exported managed config -->
  <g>
    <rect x="1076" y="158" width="186" height="236" rx="13" fill="#0b1117" stroke="#24d6a8" stroke-opacity="0.55"></rect>
    <rect x="1076" y="158" width="186" height="26" rx="13" fill="#0e1620"></rect>
    <rect x="1076" y="171" width="186" height="13" fill="#0e1620"></rect>
    <circle cx="1096" cy="171" r="3.5" fill="#ff6b6b" fill-opacity="0.75"></circle>
    <circle cx="1108" cy="171" r="3.5" fill="#e3c26f" fill-opacity="0.75"></circle>
    <circle cx="1120" cy="171" r="3.5" fill="#24d6a8" fill-opacity="0.75"></circle>
    <text x="1252" y="175" fill="#46596b" font-size="9.5" text-anchor="end">managed</text>

    <text x="1092" y="216" fill="#5d7184" font-size="14" font-weight="700">{</text>
    <text x="1110" y="216" fill="#a9bccd" font-size="11">&quot;allowed</text>
    <text x="1110" y="232" fill="#a9bccd" font-size="11"> McpServers&quot;:</text>
    <text x="1122" y="251" fill="#24d6a8" font-size="11">filesystem,</text>
    <text x="1122" y="268" fill="#24d6a8" font-size="11">time, sentry</text>
    <text x="1092" y="291" fill="#a9bccd" font-size="11">&quot;deniedMcp</text>
    <text x="1092" y="307" fill="#a9bccd" font-size="11"> Servers&quot;: [ ]</text>
    <text x="1092" y="331" fill="#5d7184" font-size="14" font-weight="700">}</text>

    <text x="1169" y="372" fill="#46596b" font-size="10.5" text-anchor="middle">admin deploys</text>
  </g>
</svg>
