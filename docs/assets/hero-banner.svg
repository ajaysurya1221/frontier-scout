<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="ui-monospace, &#39;SF Mono&#39;, &#39;JetBrains Mono&#39;, Menlo, Consolas, &#39;DejaVu Sans Mono&#39;, monospace" role="img" aria-label="Frontier Scout — sanctioned MCP packs, a research preview. Repo-rank approved MCP servers into a static safety map, then export an admin-deployable Claude Code managed-config fragment. Shown as a left-to-right flow: a repo-ranked candidate list, a static safety check, and a config fragment. Claude Code first, static analysis, keyless, research preview, MIT.">
  <defs>
    <radialGradient id="glow" cx="20%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#24d6a8" stop-opacity="0.13"></stop>
      <stop offset="60%" stop-color="#24d6a8" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="checkHeat" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#24d6a8" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#24d6a8" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="riskHeat" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.16"></stop>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"></stop>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="470" rx="0"></rect></clipPath>
  </defs>


  <rect width="1280" height="470" fill="#05080b"></rect>
  <g clip-path="url(#frame)">
    <rect width="1280" height="470" fill="url(#glow)"></rect>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="469" fill="none" stroke="#1a2c41"></rect>


  <text x="86" y="120" fill="#24d6a8" font-size="16" letter-spacing="5.5">SANCTIONED MCP PACKS · RESEARCH PREVIEW</text>

  <text x="80" y="220" fill="#d9f7ff" font-size="86" font-weight="700" letter-spacing="1">FRONTIER</text>
  <text x="80" y="308" fill="#24d6a8" font-size="86" font-weight="700" letter-spacing="1">SCOUT</text>


  <text x="86" y="361" fill="#a9bccd" font-size="16.5">Repo-rank approved MCP servers into a static safety map,</text>
  <text x="86" y="387" fill="#a9bccd" font-size="16.5">then export a Claude Code managed-config fragment.</text>

  <text x="86" y="428" font-size="13.5" letter-spacing="0.5"><tspan fill="#46596b">Claude Code first</tspan><tspan fill="#1a2c41">   ·   </tspan><tspan fill="#46596b">static analysis</tspan><tspan fill="#1a2c41">   ·   </tspan><tspan fill="#46596b">keyless</tspan><tspan fill="#1a2c41">   ·   </tspan><tspan fill="#46596b">research preview</tspan><tspan fill="#1a2c41">   ·   </tspan><tspan fill="#46596b">MIT</tspan></text>


  <line x1="726" y1="92" x2="726" y2="430" stroke="#1a2c41"></line>


  <text x="772" y="130" fill="#24d6a8" font-size="16.5" letter-spacing="3.2">RANK</text>
  <text x="956" y="130" fill="#24d6a8" font-size="16.5" letter-spacing="3.2">CHECK</text>
  <text x="1122" y="130" fill="#24d6a8" font-size="16.5" letter-spacing="3.2">EXPORT</text>


  <g>
    <rect x="772" y="160" width="150" height="220" rx="11" fill="#0b1117" stroke="#24d6a8" stroke-opacity="0.42"></rect>
    <text x="788" y="190" fill="#5d7184" font-size="10.5" letter-spacing="2">REPO-RANKED</text>


    <rect x="788" y="206" width="118" height="40" rx="7" fill="#0e1620" stroke="#1a2c41"></rect>
    <text x="800" y="223" fill="#d9f7ff" font-size="11">filesystem</text>
    <text x="800" y="238" fill="#24d6a8" font-size="9.5">fit high</text>
    <text x="894" y="238" fill="#e3c26f" font-size="9.5" text-anchor="end">risk med</text>

    <rect x="788" y="252" width="118" height="40" rx="7" fill="#0e1620" stroke="#1a2c41"></rect>
    <text x="800" y="269" fill="#d9f7ff" font-size="11">time</text>
    <text x="800" y="284" fill="#24d6a8" font-size="9.5">fit high</text>
    <text x="894" y="284" fill="#7aa6ff" font-size="9.5" text-anchor="end">risk low</text>

    <rect x="788" y="298" width="118" height="40" rx="7" fill="#0e1620" stroke="#1a2c41"></rect>
    <text x="800" y="315" fill="#d9f7ff" font-size="11">sentry</text>
    <text x="800" y="330" fill="#24d6a8" font-size="9.5">fit high</text>
    <text x="894" y="330" fill="#e3c26f" font-size="9.5" text-anchor="end">risk med</text>

    <text x="788" y="361" fill="#46596b" font-size="8.5">your repo · tree-sitter</text>
  </g>


  <g stroke="#24d6a8" stroke-opacity="0.5" fill="none">
    <line x1="922" y1="270" x2="952" y2="270"></line>
  </g>
  <path d="M952 270 l-9 -5 v10 z" fill="#24d6a8" fill-opacity="0.6"></path>


  <g>
    <circle cx="1004" cy="270" r="52" fill="#0b1117" stroke="#24d6a8" stroke-opacity="0.42"></circle>
    <circle cx="1004" cy="270" r="52" fill="url(#checkHeat)"></circle>

    <path d="M982 270 l14 14 l26 -30" fill="none" stroke="#24d6a8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="1004" y="206" fill="#5d7184" font-size="10" letter-spacing="2" text-anchor="middle">STATIC SAFETY</text>
    <text x="1004" y="340" fill="#46596b" font-size="10" text-anchor="middle">no server run</text>
  </g>


  <g>
    <circle cx="958" cy="363" r="3.5" fill="#ff6b6b"></circle>
    <text x="970" y="367" fill="#5d7184" font-size="9.5">high-risk gated</text>
  </g>


  <g stroke="#24d6a8" stroke-opacity="0.5" fill="none">
    <line x1="1056" y1="270" x2="1086" y2="270"></line>
  </g>
  <path d="M1086 270 l-9 -5 v10 z" fill="#24d6a8" fill-opacity="0.6"></path>


  <g>
    <rect x="1086" y="180" width="118" height="180" rx="11" fill="#0b1117" stroke="#24d6a8" stroke-opacity="0.42"></rect>
    <rect x="1086" y="180" width="118" height="22" rx="11" fill="#0e1620"></rect>
    <rect x="1086" y="192" width="118" height="10" fill="#0e1620"></rect>
    <circle cx="1102" cy="191" r="3" fill="#ff6b6b" fill-opacity="0.7"></circle>
    <circle cx="1112" cy="191" r="3" fill="#e3c26f" fill-opacity="0.7"></circle>
    <circle cx="1122" cy="191" r="3" fill="#24d6a8" fill-opacity="0.7"></circle>
    <text x="1196" y="195" fill="#46596b" font-size="9" text-anchor="end">managed</text>

    <text x="1100" y="226" fill="#5d7184" font-size="13" font-weight="700">{</text>
    <text x="1116" y="227" fill="#a9bccd" font-size="9.5">&quot;allowed</text>
    <text x="1116" y="239" fill="#a9bccd" font-size="9.5"> McpServers&quot;:</text>
    <text x="1126" y="256" fill="#24d6a8" font-size="9.5">filesystem,</text>
    <text x="1126" y="271" fill="#24d6a8" font-size="9.5">time, sentry</text>
    <text x="1100" y="293" fill="#a9bccd" font-size="9.5">&quot;deniedMcp</text>
    <text x="1100" y="306" fill="#a9bccd" font-size="9.5"> Servers&quot;: [ ]</text>
    <text x="1100" y="330" fill="#5d7184" font-size="13" font-weight="700">}</text>

    <text x="1145" y="350" fill="#46596b" font-size="9.5" text-anchor="middle">admin deploys</text>
  </g>
</svg>
