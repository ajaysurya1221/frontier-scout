<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="ui-monospace, &#39;SF Mono&#39;, &#39;JetBrains Mono&#39;, Menlo, Consolas, &#39;DejaVu Sans Mono&#39;, monospace" role="img" aria-label="Frontier Scout — the AI adoption radar. See new AI first, prove it fits your repo before you ship. Shown with an adoption matrix of fit by risk: 377 scanned this week, 5 worth your time.">
