  <text x="86" y="418" font-size="11.5" letter-spacing="0.4"><tspan fill="#46596b">Claude Code first</tspan><tspan fill="#1a2c41"> · </tspan><tspan fill="#46596b">static analysis</tspan><tspan fill="#1a2c41"> · </tspan><tspan fill="#46596b">keyless</tspan><tspan fill="#1a2c41"> · </tspan><tspan fill="#46596b">research preview</tspan><tspan fill="#1a2c41"> · </tspan><tspan fill="#46596b">MIT</tspan></text>


