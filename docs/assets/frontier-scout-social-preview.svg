<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="ui-monospace, &#39;SF Mono&#39;, &#39;JetBrains Mono&#39;, Menlo, Consolas, &#39;DejaVu Sans Mono&#39;, monospace" role="img" aria-label="Frontier Scout — sanctioned MCP packs for Claude Code, a research preview. Repo-rank approved MCP servers, read each server's static safety map, and export an admin-deployable managed-config fragment. Repo-ranked, static safety, managed-config export.">
