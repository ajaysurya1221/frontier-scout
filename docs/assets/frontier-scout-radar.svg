<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Frontier Scout — the AI adoption radar. See new AI first, prove it fits your repo before you ship.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c121d"></stop>
      <stop offset="1" stop-color="#070b13"></stop>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="0%" r="70%">
      <stop offset="0" stop-color="#2d6cff" stop-opacity="0.22"></stop>
      <stop offset="1" stop-color="#2d6cff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d82ff"></stop>
      <stop offset="1" stop-color="#1fcf9f"></stop>
    </linearGradient>
    <radialGradient id="rfill" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1fcf9f" stop-opacity="0.16"></stop>
      <stop offset="62%" stop-color="#1fcf9f" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fcf9f" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#1fcf9f" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="rc"><circle cx="1015" cy="220" r="155"></circle></clipPath>
    <style>
      /* GitHub strips web fonts from SVGs, so we use system fallbacks.
         Animation is a progressive enhancement: where SVG animation is
         disabled (e.g. GitHub's image proxy) it degrades to a clean static
         frame — the sweep rests at 12 o'clock and the blips stay visible. */
      .h { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .s { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; }
      .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      #sweep { transform-origin: 1015px 220px; animation: sweep 4.2s linear infinite; }
      .bl { animation: pulse 3s ease-in-out infinite; }
      .b2 { animation-delay: .6s; }
      .b3 { animation-delay: 1.2s; }
      .b4 { animation-delay: 1.8s; }
      @keyframes sweep { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: .9; } 50% { opacity: .4; } }
    </style>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"></rect>
  <rect width="1280" height="440" fill="url(#glow)"></rect>

  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 73.3H1280M0 146.6H1280M0 220H1280M0 293.3H1280M0 366.6H1280"></path>
    <path d="M53 0V440M160 0V440M267 0V440M374 0V440M481 0V440M588 0V440M695 0V440"></path>
  </g>

  <g transform="translate(72,70)">
    <circle cx="5" cy="-4" r="5" fill="#1fcf9f"></circle>
    <text x="20" y="0" class="m" font-size="15" letter-spacing="4" fill="#1fcf9f">FRONTIER SCOUT · AI ADOPTION RADAR</text>
  </g>

  <g transform="translate(70,150)">
    <text class="h" font-size="52" fill="#eaf1fb" letter-spacing="-1">See new AI <tspan fill="url(#grad)">first</tspan>.</text>
    <text y="60" class="h" font-size="52" fill="#eaf1fb" letter-spacing="-1">Prove it fits <tspan fill="url(#grad)">your repo</tspan>.</text>
  </g>

  <g transform="translate(72,288)" class="s" fill="#9fb2c9" font-size="17">
    <text>Watches GitHub · MCP · Hugging Face · Hacker News · RSS — and turns the</text>
    <text y="26">firehose into source-backed <tspan fill="#eaf1fb" font-weight="700">ADOPT / TRIAL / ASSESS / HOLD</tspan> verdicts</text>
    <text y="52">mapped to your code. <tspan fill="#eaf1fb" font-weight="700">Local-first. Try before you trust.</tspan></text>
  </g>

  <g transform="translate(72,392)" class="m" font-size="13">
    <g>
      <rect x="0" y="-16" rx="6" width="118" height="26" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"></rect>
      <circle cx="16" cy="-3" r="4" fill="#1fcf9f"></circle>
      <text x="28" y="1" fill="#9fb2c9">v1.5.0</text>
    </g>
    <g transform="translate(130,0)">
      <rect x="0" y="-16" rx="6" width="104" height="26" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"></rect>
      <circle cx="16" cy="-3" r="4" fill="#4d82ff"></circle>
      <text x="28" y="1" fill="#9fb2c9">py 3.11+</text>
    </g>
    <g transform="translate(246,0)">
      <rect x="0" y="-16" rx="6" width="70" height="26" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"></rect>
      <text x="14" y="1" fill="#9fb2c9">MIT</text>
    </g>
    <g transform="translate(328,0)">
      <rect x="0" y="-16" rx="6" width="150" height="26" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"></rect>
      <circle cx="16" cy="-3" r="4" fill="#f0c66a"></circle>
      <text x="28" y="1" fill="#9fb2c9">no telemetry · local</text>
    </g>
  </g>

  <g clip-path="url(#rc)">
    <circle cx="1015" cy="220" r="155" fill="#070b13"></circle>
    <circle cx="1015" cy="220" r="155" fill="url(#rfill)"></circle>
    <g id="sweep">
      <path d="M1015 220 L1015 65 A155 155 0 0 1 1118 104 Z" fill="url(#sweepg)"></path>
    </g>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10">
    <circle cx="1015" cy="220" r="155" stroke-opacity="0.18"></circle>
    <circle cx="1015" cy="220" r="116"></circle>
    <circle cx="1015" cy="220" r="77"></circle>
    <circle cx="1015" cy="220" r="38"></circle>
    <path d="M1015 70V370M865 220H1165"></path>
  </g>
  <circle cx="1015" cy="220" r="5" fill="#1fcf9f"></circle>

  <g>
    <circle class="bl" cx="1075" cy="160" r="6" fill="#12a06f"></circle>
    <circle class="bl b2" cx="958" cy="270" r="6" fill="#f0c66a"></circle>
    <circle class="bl b3" cx="1095" cy="285" r="6" fill="#4d82ff"></circle>
    <circle class="bl b4" cx="942" cy="172" r="6" fill="#d2453d"></circle>
  </g>
</svg>
