# action.yml — composite GitHub Action wrapping `frontier-scout agent verify-pr`.
#
# The action repo IS the Python package: by default it installs itself from the
# checked-out action source ($GITHUB_ACTION_PATH), so the code that runs is exactly
# the ref the consumer pinned — no PyPI propagation race at release time.
#
# Trusted execution path: the workspace holds the candidate (PR) checkout, so no
# step runs Python from it. Every run step uses `working-directory: runner.temp`
# (outside the checkout), and every Python call is `python -I` (isolated: neither
# the current directory nor the script directory is on sys.path, no user site,
# PYTHON* variables ignored). A PR-root pip.py, json.py or frontier_scout/ package
# therefore cannot replace the installer, the verifier or these helpers. The
# candidate repository reaches the verifier only as an absolute --repo path.
#
# Honesty model: the verifier's output is control evidence, not a guarantee.
# Scope is checked against the policy + lock at the BASE commit (a PR cannot widen
# its own scope). Receipts are unsigned observations: they never authenticate an
# approval, so a changed protected path is never a pass. The evidence JSON is
# *attested* only when attest: "true" and checked with `gh attestation verify`;
# attestation proves which workflow produced it, not who approved the change.
# UNVERIFIED is never reported as a pass.
name: "Frontier Scout PR Scope Verifier"
description: >-
  Check an AI-agent PR's diff against the frontier-scout policy scope declared at
  the base commit. Non-pass when the diff, policy identity or evidence cannot be
  established; protected-path approvals are reported, not authenticated. Emits
  GitHub annotations, a machine-readable evidence JSON, and (optionally) a signed
  attestation of that evidence via GitHub attestations.
author: "Ajay Surya"
branding:
  icon: "shield"
  color: "blue"

inputs:
  base:
    description: >-
      Base git ref to diff against (e.g. origin/main). Default: derived from the
      pull_request event (origin/$GITHUB_BASE_REF). The action FAILS if no base
      is resolvable — a missing base is never treated as an empty diff
      (fail-closed). Requires actions/checkout with fetch-depth: 0.
    default: ""
  receipts:
    description: >-
      Glob of receipt JSON files. A relative glob is resolved against `repo`.
      Empty = library defaults (frontier-scout-receipts/*.json and
      .frontier-scout/receipts/*.json under `repo`).
    default: ""
  advisory:
    description: >-
      "true" downgrades violations to warnings and never fails the job. Default
      false: this is a fail-closed verifier. Use true only while onboarding.
    default: "false"
  repo:
    description: >-
      Path to the repository root to verify. A relative path is resolved against
      $GITHUB_WORKSPACE and passed to --repo as an absolute path.
    default: "."
  version:
    description: >-
      frontier-scout version to install from PyPI (e.g. "2.1.0"). Empty (default)
      installs the action's own bundled source — the exact code at the pinned ref.
    default: ""
  attest:
    description: >-
      "true" signs the evidence JSON with actions/attest (custom predicate).
      Requires job permissions: id-token: write, attestations: write,
      contents: read. If attestation cannot be produced the action FAILS — it
      never silently degrades to unsigned evidence. Unavailable to fork PRs.
    default: "false"
  evidence-path:
    description: >-
      Where to write the evidence JSON. Empty = $RUNNER_TEMP/frontier-scout-evidence.json
      (outside the workspace, so the verified tree stays clean). A relative path is
      resolved against $GITHUB_WORKSPACE. Any existing file there is removed first.
    default: ""
  evidence-artifact:
    description: "If non-empty, upload the evidence JSON as a workflow artifact with this name."
    default: ""
  python-version:
    description: "Python for the verifier (frontier-scout needs >= 3.11)."
    default: "3.12"

outputs:
  ok:
    description: "true/false — whether the job passes: verdict pass in enforcing mode; always true in advisory mode (read verdict)."
    value: ${{ steps.verify.outputs.ok }}
  verdict:
    description: >-
      pass | fail | unverified, computed the same way in both modes (unverified = the
      diff could not be collected, or a protected path changed and its approval
      provenance is not authenticated; never reported as pass). Advisory mode only
      stops the job from failing.
    value: ${{ steps.verify.outputs.verdict }}
  summary:
    description: "One-line human summary from the verifier."
    value: ${{ steps.verify.outputs.summary }}
  violations:
    description: "Violation count."
    value: ${{ steps.verify.outputs.violations }}
  warnings:
    description: "Warning count."
    value: ${{ steps.verify.outputs.warnings }}
  evidence-path:
    description: "Absolute path of the evidence JSON written via --json-out."
    value: ${{ steps.verify.outputs.evidence-path }}
  attestation-id:
    description: "Attestation ID (empty unless attest: true)."
    value: ${{ steps.attest.outputs.attestation-id }}
  attestation-url:
    description: "Attestation URL (empty unless attest: true)."
    value: ${{ steps.attest.outputs.attestation-url }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6 (Node 24)
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install frontier-scout
      shell: bash
      # SECURITY: run outside the candidate checkout, with isolated Python (see header).
      working-directory: ${{ runner.temp }}
      env:
        FS_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$FS_VERSION" ]; then
          python -I -m pip install --quiet "frontier-scout==${FS_VERSION}"
        else
          # Install the action's own source: exactly the code at the pinned ref.
          python -I -m pip install --quiet "$GITHUB_ACTION_PATH"
        fi
        python -I -m frontier_scout --version

    - name: Verify PR scope (fail-closed)
      id: verify
      shell: bash
      # SECURITY: inputs only ever enter this script via env (never inline
      # expression interpolation inside run bodies) — script-injection guard.
      # Runs outside the candidate checkout, with isolated Python (see header).
      working-directory: ${{ runner.temp }}
      env:
        FS_BASE: ${{ inputs.base }}
        FS_RECEIPTS: ${{ inputs.receipts }}
        FS_ADVISORY: ${{ inputs.advisory }}
        FS_REPO: ${{ inputs.repo }}
        FS_EVIDENCE_IN: ${{ inputs.evidence-path }}
      run: |
        # 1) Resolve the base — refuse to run without one (a missing base must
        #    never become "0 changed files = PASS").
        if [ -n "$FS_BASE" ]; then
          base="$FS_BASE"
        elif [ -n "$GITHUB_BASE_REF" ]; then
          base="origin/${GITHUB_BASE_REF}"
        else
          echo "::error::frontier-scout: no 'base' input and not a pull_request event — cannot determine the diff base (fail-closed). Pass base: explicitly."
          exit 1
        fi

        # 2) Absolute paths: this step runs outside the checkout. A relative repo
        #    or evidence path is anchored at $GITHUB_WORKSPACE, a relative receipts
        #    glob at the repo. Evidence defaults to outside the workspace so the
        #    tree stays clean; a stale file there is removed so only this run's
        #    output is ever read back.
        case "$FS_REPO" in
          /*) repo="$FS_REPO" ;;
          *) repo="$GITHUB_WORKSPACE/$FS_REPO" ;;
        esac
        repo="${repo%/.}"
        evidence="${FS_EVIDENCE_IN:-$RUNNER_TEMP/frontier-scout-evidence.json}"
        case "$evidence" in
          /*) ;;
          *) evidence="$GITHUB_WORKSPACE/$evidence" ;;
        esac
        mkdir -p "$(dirname "$evidence")"
        rm -f -- "$evidence"

        # 3) Run the verifier. Annotations (::error/::warning) go to stdout and
        #    are picked up by the runner; --json-out writes the evidence file.
        #    Capture the exit code instead of failing here so the evidence is
        #    still attested/uploaded on FAIL; the final step enforces the verdict.
        args=( agent verify-pr --repo "$repo" --base "$base" --json-out "$evidence" )
        if [ -n "$FS_RECEIPTS" ]; then
          case "$FS_RECEIPTS" in
            /*) receipts="$FS_RECEIPTS" ;;
            *) receipts="$repo/$FS_RECEIPTS" ;;
          esac
          args+=( --receipts "$receipts" )
        fi
        if [ "$FS_ADVISORY" = "true" ]; then
          args+=( --advisory )
        fi
        code=0
        python -I -m frontier_scout "${args[@]}" || code=$?

        if [ ! -s "$evidence" ]; then
          echo "::error::frontier-scout: no evidence JSON was produced (verifier crashed?) — failing closed."
          if [ "$code" = "0" ]; then code=1; fi
          exit "$code"
        fi

        # 4) Step outputs + job summary. Heredoc delimiters are random so a
        #    crafted base ref echoed into the summary cannot inject outputs.
        EVIDENCE_PATH="$evidence" EXIT_CODE="$code" python -I - <<'PY'
        import json, os, uuid

        path = os.environ["EVIDENCE_PATH"]
        code = os.environ["EXIT_CODE"]
        with open(path) as fh:
            data = json.load(fh)
        verdict = data.get("verdict") or (
            "unverified" if data.get("unverified") else ("pass" if data.get("ok") else "fail")
        )
        mode = "advisory" if data.get("advisory") else "enforcing"
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            def emit(name, value):
                tok = uuid.uuid4().hex
                out.write(f"{name}<<{tok}\n{value}\n{tok}\n")
            emit("ok", str(bool(data.get("ok"))).lower())
            emit("verdict", verdict)
            emit("summary", data.get("summary", ""))
            emit("violations", len(data.get("violations") or []))
            emit("warnings", len(data.get("warnings") or []))
            emit("evidence-path", path)
            emit("exit-code", code)
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
            s.write(f"### Frontier Scout verify-pr: {verdict.upper()} ({mode})\n\n")
            s.write(f"{data.get('summary', '')}\n\n")
            s.write(
                "| scope | approval provenance | files checked | receipts | violations | warnings |\n"
                "|---|---|---|---|---|---|\n"
            )
            s.write(
                f"| {data.get('scope', 'n/a')} | {data.get('approval_provenance', 'n/a')} "
                f"| {data.get('checked_files', 0)} | {data.get('receipt_count', 0)} "
                f"| {len(data.get('violations') or [])} | {len(data.get('warnings') or [])} |\n\n"
            )
            s.write(
                "> Scope is checked against the base commit's policy. Receipts are unsigned "
                "observations and never authenticate an approval. Attestation (attest: true, "
                "`gh attestation verify`) proves which workflow produced this JSON, not who "
                "approved the change.\n"
            )
        PY

    - name: Build attestation predicate
      if: ${{ inputs.attest == 'true' }}
      id: predicate
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        FS_ADVISORY: ${{ inputs.advisory }}
        FS_VERDICT: ${{ steps.verify.outputs.verdict }}
      run: |
        pred="$RUNNER_TEMP/frontier-scout-predicate.json"
        FS_PRED="$pred" python -I - <<'PY'
        import json, os

        with open(os.environ["FS_PRED"], "w") as fh:
            json.dump(
                {
                    "verifier": "frontier-scout/verify-pr",
                    "mode": "advisory" if os.environ["FS_ADVISORY"] == "true" else "enforcing",
                    "verdict": os.environ["FS_VERDICT"],
                },
                fh,
            )
        PY
        echo "path=$pred" >> "$GITHUB_OUTPUT"

    - name: Attest evidence (signed; runs even when the verdict is FAIL)
      if: ${{ inputs.attest == 'true' }}
      id: attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ steps.verify.outputs.evidence-path }}
        predicate-type: "https://github.com/ajaysurya1221/frontier-scout/predicate/verify-pr/v1"
        predicate-path: ${{ steps.predicate.outputs.path }}

    - name: Upload evidence artifact
      if: ${{ inputs.evidence-artifact != '' }}
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5 (Node 24)
      with:
        name: ${{ inputs.evidence-artifact }}
        path: ${{ steps.verify.outputs.evidence-path }}

    - name: Enforce verdict
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        FS_EXIT: ${{ steps.verify.outputs.exit-code }}
      run: |
        if [ "$FS_EXIT" != "0" ]; then
          echo "::error::frontier-scout: verify-pr did not pass (exit $FS_EXIT; FAIL or UNVERIFIED). See annotations above."
          exit "$FS_EXIT"
        fi
