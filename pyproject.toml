[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-scout"
version = "2.1.0"
description = "PR scope verifier + policy compiler for AI coding agents (Claude Code first): verify in CI — fail-closed, with optional signed evidence via GitHub attestations — that an agent PR stayed within approved scope, and compile a typed repo policy into native controls. Keyless and offline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Ajay Surya"}
]
keywords = [
  "ai",
  "agents",
  "mcp",
  "developer-tools",
  "agent-governance",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "build>=1.5.0",
  "coverage>=7.14.1",
  "detect-secrets>=1.5.0",
  "mypy>=2.1.0",
  "pip-audit>=2.10.0",
  "pytest>=9.0.3",
  "ruff>=0.15.16",
]

[project.urls]
Homepage = "https://github.com/ajaysurya1221/frontier-scout"
Repository = "https://github.com/ajaysurya1221/frontier-scout"
Issues = "https://github.com/ajaysurya1221/frontier-scout/issues"

[project.scripts]
frontier-scout = "frontier_scout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frontier_scout*", "outputs*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["frontier_scout/agent_firewall", "frontier_scout/exporters"]

[tool.pytest.ini_options]
markers = [
  "live: tests that require network or external services",
]
