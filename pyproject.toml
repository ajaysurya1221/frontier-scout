[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-scout"
version = "2.0.1"
description = "Policy compiler + PR scope verifier for AI coding agents (Claude Code first): compile a typed repo policy into native hooks/settings, write local action records, and verify in CI that a PR stayed within approved scope. Keyless and offline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Ajay Surya"}
]
keywords = [
  "ai",
  "agents",
  "mcp",
  "developer-tools",
  "agent-governance",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.10",
  "build>=1.2.0",
  "coverage>=7.6.0",
  "detect-secrets>=1.5.0",
  "mypy>=1.10.0",
  "pip-audit>=2.7.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/ajaysurya1221/frontier-scout"
Repository = "https://github.com/ajaysurya1221/frontier-scout"
Issues = "https://github.com/ajaysurya1221/frontier-scout/issues"

[project.scripts]
frontier-scout = "frontier_scout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frontier_scout*", "outputs*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["frontier_scout/agent_firewall", "frontier_scout/exporters"]

[tool.pytest.ini_options]
markers = [
  "live: tests that require network or external services",
]
