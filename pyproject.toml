[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-scout"
version = "2.2.0"
description = "PR scope verifier and policy compiler for Claude Code. Checks diffs against base-branch declared scope; unsigned approvals remain UNVERIFIED. Keyless and offline by default; an optional decision model makes network calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Ajay Surya Senthilrajan"}
]
keywords = [
  "ai",
  "agents",
  "mcp",
  "developer-tools",
  "agent-governance",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.14.1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "build>=1.6.1",
  "coverage>=7.16.2",
  "detect-secrets>=1.5.0",
  "mypy>=2.4.0",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
]

[project.urls]
Homepage = "https://github.com/ajaysurya1221/frontier-scout"
Repository = "https://github.com/ajaysurya1221/frontier-scout"
Issues = "https://github.com/ajaysurya1221/frontier-scout/issues"

[project.scripts]
frontier-scout = "frontier_scout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frontier_scout*", "outputs*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["frontier_scout/agent_firewall", "frontier_scout/exporters"]

[tool.pytest.ini_options]
markers = [
  "live: tests that require network or external services",
]
