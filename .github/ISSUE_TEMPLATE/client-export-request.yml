name: Client / export request
description: Want export for a client Frontier Scout doesn't support yet? Tell us (roadmap signal only).
title: "[export-request] "
labels: ["feedback", "export-request", "roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        Today Frontier Scout exports **Claude Code managed-config fragments only**. Copilot / Cursor /
        Docker / GitHub allow-list exporters are **roadmap, not built**. This request is **weak signal**
        for prioritization — it is not a commitment, not a timeline, and not validation.
  - type: dropdown
    id: client
    attributes:
      label: Which client / target do you want export for?
      options:
        - Copilot
        - Cursor
        - Docker MCP catalog
        - GitHub allow-list
        - Other
    validations:
      required: true
  - type: textarea
    id: surface
    attributes:
      label: What exact config surface / format would it need to produce?
      description: "e.g. ~/.cursor/mcp.json, a Docker custom-catalog entry, a GitHub allow-list payload, an MDM profile."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you do with it — and would you route it through a real deployment process?
