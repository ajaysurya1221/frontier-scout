# Frontier Scout — verify PR stayed within approved scope.
# Self-hosting note: this repo IS frontier-scout, so it installs from source
# (`pip install .`) rather than from PyPI, and runs in `--advisory` mode while the
# repo is onboarding (warns instead of blocking, since not every contributor's PR
# carries hook-written receipts yet). Drop `--advisory` to make it a hard gate.
name: Frontier Scout verify
on:
  pull_request:
# Least-privilege: the verifier only reads the repo + a read-only git diff.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install .
      - run: >-
          frontier-scout agent verify-pr --repo .
          --base "origin/${{ github.base_ref }}"
          --receipts "frontier-scout-receipts/*.json"
          --advisory
  # Dogfood the composite Action itself: `uses: ./` resolves THIS PR's action.yml,
  # which installs THIS PR's package source ($GITHUB_ACTION_PATH) — so every PR
  # exercises the marketplace entrypoint end-to-end.
  verify-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          advisory: "true"
          evidence-artifact: "frontier-scout-evidence"
